{t:"Saída e continuação",d:"2 sai do bloqueio e ataca; 5 abre ao cesto (rolamento); 1, 3 e 4 ocupam os lados.",T:3400,m:{2:[336,244,"d",260,310],5:[306,120,0,230,200],4:[186,83],1:[29,88],3:[467,88]}}]}];
const F=.16,$=s=>document.querySelector(s),sv=$("#sv"),NS="http://www.w3.org/2000/svg";
let M=0,pi=0,si=-1,sp=1,an=0,A,E,S;
const X=x=>M?500-x:x;
const bez=(s,m,v)=>{const cx=m[3]==null?(s[0]+m[0])/2:m[3],cy=m[4]==null?(s[1]+m[1])/2:m[4],w=1-v;return[w*w*s[0]+2*w*v*cx+v*v*m[0],w*w*s[1]+2*w*v*cy+v*v*m[1]]};
function pl(a,st,id,u){const s=a.p[id],m=st.m[id];if(!m)return s;const d=m[5]||0;let v=Math.min(1,Math.max(0,(u-d)/(1-d)));return bez(s,m,v*v*v*(v*(v*6-15)+10))}
function cmp(a,st,u){const p={};for(const id in a.p)p[id]=pl(a,st,id,u);let h=a.h,b=null,r=6;
for(const[f,t,at]of st.p||[]){if(u>=at+F){h=t;continue}if(u>=at){const k=(u-at)/F,x=pl(a,st,f,at),y=pl(a,st,t,at+F);b=[x[0]+(y[0]-x[0])*k,x[1]+(y[1]-x[1])*k];r=6+3*Math.sin(k*Math.PI);h=null}break}
if(h){const q=p[h],m=st.m[h];b=[q[0]+10,q[1]+9];if(m&&m[2]=="d"&&u>0&&u<1){const z=Math.sin(u*st.T/90);r=6+2*Math.abs(z);b[1]+=4*z}}
return{p,b,r,h}}
function build(){const P=J[pi];S=P.s;A=[];E=[];S.forEach((st,j)=>{A[j]=j?(st.b!=null?E[st.b]:E[j-1]):{p:P.i,h:P.h};E[j]=cmp(A[j],st,1)})}
const pg=$("#pg"),bl=$("#bl"),ov=$("#ov");
for(let i=1;i<=5;i++){const g=document.createElementNS(NS,"g");g.innerHTML=`<circle r="15" fill="var(--pl)" stroke="var(--ac)" stroke-width="2"/><text y="5.5" text-anchor="middle" font-size="16" font-weight="700" fill="var(--plt)">${i}</text>`;g.id="p"+i;pg.appendChild(g)}
function draw(R){for(const id in R.p){const q=R.p[id];$("#p"+id).setAttribute("transform",`translate(${X(q[0])},${q[1]})`)}
bl.setAttribute("cx",X(R.b[0]));bl.setAttribute("cy",R.b[1]);bl.setAttribute("r",R.r)}
function showOv(j){ov.innerHTML="";if(j<0)return;const st=S[j],a=A[j];let h="";
for(const id in st.m){const m=st.m[id],s=a.p[id],pts=[];for(let k=0;k<=30;k++){const q=bez(s,m,k/30);pts.push([X(q[0]),q[1]])}
const n=pts.length-1,dx=pts[n][0]-pts[n-1][0],dy=pts[n][1]-pts[n-1][1],l=Math.hypot(dx,dy)||1;
let P=pts;if(m[2]=="d")P=pts.map((q,k)=>{const o=k>0&&k<n?4*Math.sin(k*1.7):0,t=pts[Math.min(n,k+1)],u=pts[Math.max(0,k-1)],tx=t[0]-u[0],ty=t[1]-u[1],tl=Math.hypot(tx,ty)||1;return[q[0]-ty/tl*o,q[1]+tx/tl*o]});
const ps=P.map(q=>q.map(z=>z.toFixed(1)).join(",")).join(" ");
if(m[2]=="s"){const e=pts[n],nx=-dy/l*10,ny=dx/l*10;h+=`<polyline points="${ps}"/><line x1="${e[0]-nx}" y1="${e[1]-ny}" x2="${e[0]+nx}" y2="${e[1]+ny}" stroke-width="4"/>`}
else h+=`<polyline points="${ps}" marker-end="url(#ar)"/>`}
for(const[f,t,at]of st.p||[]){const x=pl(a,st,f,at),y=pl(a,st,t,at+F);h+=`<line x1="${X(x[0])}" y1="${x[1]}" x2="${X(y[0])}" y2="${y[1]}" stroke-dasharray="7 6" marker-end="url(#ar)"/>`}
ov.innerHTML=h}
function rest(){const j=si;if(j<0){draw(cmp(A[0],S[0],0));showOv(-1)}else{draw(cmp(A[j],S[j],1));showOv(j)}
const P=J[pi],st=S[j];$("#ct").textContent=P.n+" · "+(j<0?"posições iniciais":"passo "+(j+1)+" de "+S.length);
$("#tt").textContent=j<0?"Posições iniciais":st.t;$("#ds").textContent=j<0?"Carregue em Avançar para ver a jogada passo a passo. 1 tem a bola.":st.d;
$("#br").innerHTML=S.map((_,k)=>`<i class="${k<=j?"on":""}"></i>`).join("");
$("#bk").disabled=j<0;$("#fw").disabled=j>=S.length-1;$("#rp").disabled=j<0}
function go(d){if(an)return;let j;if(d>0){if(si>=S.length-1)return;j=++si}else{if(si<0)return;j=si--}
showOv(j);const T=S[j].T/sp,t0=performance.now();an=1;
const f=n=>{const k=Math.min(1,(n-t0)/T);draw(cmp(A[j],S[j],d>0?k:1-k));if(k<1)requestAnimationFrame(f);else{an=0;rest()}};requestAnimationFrame(f)}
function sel(k){if(an)return;pi=k;si=-1;build();rest();[...$("#tabs").children].forEach((b,i)=>b.classList.toggle("on",i==k))}
J.forEach((p,k)=>{const b=document.createElement("button");b.textContent=p.n;b.onclick=()=>sel(k);$("#tabs").appendChild(b)});
$("#fw").onclick=()=>go(1);$("#bk").onclick=()=>go(-1);
$("#rp").onclick=()=>{if(an||si<0)return;si--;rest();go(1)};
$("#mi").onclick=e=>{M^=1;e.target.textContent="⇋ Espelho: "+(M?"sim":"não");if(!an)rest()};
$("#sp").onclick=e=>{sp=sp==1?.6:sp==.6?1.5:1;e.target.textContent="Velocidade "+sp+"×"};
addEventListener("keydown",e=>{if(e.key=="ArrowRight")go(1);if(e.key=="ArrowLeft")go(-1)});
sel(0);
</script></body></html>
